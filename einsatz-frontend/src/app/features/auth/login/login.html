<mat-card class="register-card">

    <mat-card-title>Log into your Einsatz account</mat-card-title>
    <mat-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="register-form">

            <!--email-->
            <mat-form-field appearance="outline">
                <mat-label>Email</mat-label>
                <input matInput formControlName="email"/>
                @if(loginForm.controls.email.touched && loginForm.controls.email.invalid){
                    <mat-error>Email is required</mat-error>
                }
            </mat-form-field>

            <!--password-->
            <mat-form-field appearance="outline">
                <mat-label>Password</mat-label>
                <input matInput formControlName="password" type="password"/>
                @if(loginForm.controls.password.touched && loginForm.controls.password.invalid){
                    <mat-error>Password is required</mat-error>
                }
            </mat-form-field>

            <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid">Log In</button>

        </form>
    </mat-card-content>


</mat-card>
